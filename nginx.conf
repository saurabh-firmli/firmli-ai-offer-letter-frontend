server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript text/plain application/javascript application/json image/svg+xml;

    # Hashed build output - filename changes every build, safe to cache forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The app shell must never be cached - it points the browser at the current assets.
    location = /index.html {
        expires -1;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
